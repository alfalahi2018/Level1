<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Find the Words - Level 1</title>
<style>
:root{--bg:#eaf6ff;--card:#fff;--ink:#1f3347;--acc:#e0568a;--soft:#fff3d6;--line:#bcd6ea;--ok:#2e9e5b;--bad:#d64545;--sel:#ffd54a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14222e;--card:#1e3345;--ink:#eaf3fa;--acc:#f07aa6;--soft:#3a3320;--line:#3b5870}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;padding:12px}
.wrap{max-width:900px;margin:auto}
.top{display:flex;gap:10px;flex-wrap:wrap}
.top input{flex:1;min-width:110px;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);font-size:16px;padding:6px}
h1{text-align:center;color:var(--acc);margin:10px 0;font-size:clamp(28px,6vw,46px)}
.bar{background:var(--acc);color:#fff;border-radius:14px;padding:10px 16px;font-weight:bold;font-size:18px}
.hint{font-style:italic;margin:8px 4px}
.words{background:var(--soft);border:3px dashed #e5b84a;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.words span{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:6px 14px;font-weight:bold;font-size:18px;cursor:pointer}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;text-align:center;transition:transform .15s}
.big{font-size:100px;line-height:1.15;display:inline-block;cursor:pointer}
.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;animation:pop .5s}
.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;animation:shake .45s}
@keyframes pop{50%{transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}
.score{border:3px solid var(--ink);padding:8px 18px;font-weight:bold;font-size:22px;border-radius:8px}
button.act{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:18px;font-weight:bold;cursor:pointer;font-family:inherit;margin:2px}
.credit{text-align:center;margin:18px 0;opacity:.8}
#win{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
#win div{background:var(--card);border-radius:24px;padding:30px;text-align:center;max-width:90%;animation:pop .6s}
#win h2{font-size:34px;margin:0 0 8px;color:var(--acc)}
.fall{position:fixed;top:-50px;font-size:34px;animation:fall 3s linear forwards;z-index:30;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style></head><body><div class="wrap">
<div class="top"><label>Name: <input></label><label>Class: <input></label><label>Date: <input></label></div>
<h1>🐪 Find the Words 🐪</h1>
<div class="bar">⭐ Level 1: Read the words and match them with the pictures.</div>
<p class="hint">Tap a word, then tap its picture (A–E).</p>
<div class="words" id="wl"></div><div id="lst" style="display:flex;flex-wrap:wrap;gap:8px;margin:8px 0"></div><div id="pics" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px"></div>
<div class="foot"><div class="score">Level 1: <span id="sc">0</span> / 5</div><div><button class="act" id="rs">🔄 Try again</button></div></div>
<div class="credit">Created by T.Badria Alfalahi</div></div>
<div id="win"><div><div style="font-size:90px">🏆</div><h2>Well done!</h2><p style="font-size:22px">You scored <b id="fs"></b> / 5</p><button class="act" id="cl2">Close</button></div></div>
<script>
let ac;
function snd(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function good(){snd(523,.15);setTimeout(()=>snd(659,.15),120);setTimeout(()=>snd(784,.3),240)}
function bad(){snd(180,.35,"sawtooth",.12)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function rain(l){l.forEach((e,i)=>setTimeout(()=>{const s=document.createElement("div");s.className="fall";s.textContent=e;s.style.left=Math.random()*95+"vw";document.body.appendChild(s);setTimeout(()=>s.remove(),3100)},i*90))}
function celebrate(n){fs.textContent=n;win.style.display="flex";rain(["🎉","⭐","🎈","✨","🏆","🐪","🎊","🌟","🎉","⭐","🎈","✨","🎊","🌟","🏆","🐪"]);good()}
document.getElementById("cl2").onclick=()=>win.style.display="none";
document.getElementById("rs").onclick=()=>build();
document.getElementById("wl").innerHTML=["camel","oryx","turtle","tail","hump","cat","elephant","shark"].map(w=>`<span onclick="say('${w}')">⭐ ${w}</span>`).join("");
const W=[["camel","A"],["turtle","C"],["shark","B"],["elephant","D"],["oryx","E"]];
const P=[["A","🐪","camel"],["B","🦈","shark"],["C","🐢","turtle"],["D","🐘","elephant"],["E","🦌","oryx"]];
let sel=null,score=0;
function build(){sel=null;score=0;sc.textContent=0;win.style.display="none";
 lst.innerHTML="";pics.innerHTML="";
 W.forEach((w,i)=>{const b=document.createElement("button");b.className="act";b.style.background="var(--card)";b.style.color="var(--ink)";b.style.border="3px solid var(--line)";b.innerHTML=`${i+1}. ${w[0]} <span>___</span>`;b.dataset.w=w[0];
  b.onclick=()=>{if(b.classList.contains("ok"))return;[...lst.children].forEach(x=>x.style.outline="");sel=w;b.style.outline="4px solid var(--sel)";say(w[0]);snd(440,.1)};lst.appendChild(b)});
 P.forEach(p=>{const c=document.createElement("div");c.className="card";c.innerHTML=`<div style="font-weight:bold;font-size:24px;color:var(--acc)">${p[0]}</div><div class="big">${p[1]}</div><div class="tag" style="font-weight:bold;font-size:20px;min-height:28px">&nbsp;</div>`;
  c.onclick=()=>{if(c.classList.contains("ok"))return;
   if(!sel){c.classList.add("bad");setTimeout(()=>c.classList.remove("bad"),450);bad();return}
   if(sel[1]===p[0]){c.classList.add("ok");c.querySelector(".tag").textContent=sel[0];const b=[...lst.children].find(x=>x.dataset.w===sel[0]);b.classList.add("ok");b.style.outline="";b.querySelector("span").textContent=p[0];score++;sc.textContent=score;good();say(sel[0]);sel=null;if(score==5)setTimeout(()=>celebrate(5),800)}
   else{c.classList.add("bad");setTimeout(()=>c.classList.remove("bad"),500);bad()}};
  pics.appendChild(c)})}
build();</script></body></html>
